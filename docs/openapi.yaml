openapi: 3.0.3
info:
  title: DSG Quotes API
  version: 0.2.0
  x-cors:
    appliesTo: "/c/*"
    allowedOrigins: "echo request Origin, including the literal string null"
    allowedHeaders: [Authorization, Content-Type]
    allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    preflight: "OPTIONS on every /c/* path returns 204 without authentication"
    maxAgeSeconds: 600
  description: |
    Contract for the DSG Quotes app. Source of truth for backend, storefront, customer-account, admin and QA.
    Changes go through a PR touching only `docs/` and `packages/shared/` (tag the lead), then
    `pnpm -F shared gen:types` regenerates `packages/shared/src/api.ts`.

    **Customer (`/c`) routes** are reached via the Shopify app proxy (`/apps/quotes/c/...`, HMAC verified) or with a
    customer-account session token, and are always scoped to the caller's company location.
    Customer schemas never contain `cost`, `marginPct`, `internalNote` or internal messages
    (CLAUDE.md rules 4 and 5); a contract test enforces it.

    **Absolute HTTPS origin for `/c/*`.** The customer-account extension runs in a sandbox with no app proxy, so every
    `/c/*` route is also served directly at `https://quotes.dsg.direct/c/...` (third server below, host configurable).
    Auth there is the customer-account session token (`Authorization: Bearer <token>`); the app proxy HMAC does not
    apply. CORS (see `x-cors`): `Access-Control-Allow-Origin` echoes the request `Origin` and also allows the literal
    `null` origin (sandboxed iframes and workers send `Origin: null`); `Access-Control-Allow-Headers` includes
    `Authorization` and `Content-Type`; `Access-Control-Allow-Methods` is `GET, POST, PUT, PATCH, DELETE, OPTIONS`;
    every `/c/*` path answers an `OPTIONS` preflight with 204 and no auth, `Access-Control-Max-Age: 600`. Credentials
    (cookies) are not used and `Access-Control-Allow-Credentials` is not sent. `/s/*` and `/hooks/*` send no CORS headers.

    **Staff (`/s`) routes** use the Shopify admin session token (embedded app).

    **Notes.** `lineNote` (on a line, both customer and staff shapes) is customer-visible: the customer writes it on
    their draft and the rep may edit it on the working revision. `internalNote` (quote level, staff only) is private
    and is never copied to any `Customer*` shape, email, SMS or PDF. There is no per-line internal note.

    **Rate limiting is deferred.** The API does not rate limit in this revision; `RATE_LIMITED` is reserved.

    **Webhooks and inbound hooks** (`/webhooks/shopify`, `/hooks/email-inbound`, `/hooks/twilio-inbound`) are all
    served by `apps/api` on the web service. The two provider hooks are implemented and owned by the notifications
    agent (code lives in `apps/api` routes that call `apps/worker` libraries); backend owns `/webhooks/shopify`.

    Money is a decimal string with 2 places (e.g. "1234.50"). Ids are opaque strings; Shopify ids are GIDs.
    Timestamps are ISO 8601 UTC.
servers:
  - url: /apps/quotes
    description: App proxy (storefront and customer account)
  - url: https://{host}
    description: |
      Absolute HTTPS origin for `/c/*` (customer-account extension). Paths are `/c/...` directly under the origin
      (no `/apps/quotes` prefix). Customer-account session token auth, CORS as described in the API description.
    variables:
      host:
        default: quotes.dsg.direct
        description: Production host. Dev and staging override it.
  - url: /api
    description: Embedded admin app server
  - url: http://localhost:4010
    description: Prism mock (`pnpm -F shared mock`)
tags:
  - name: customer
    description: "/c routes. Customer-safe shapes only."
  - name: staff
    description: "/s routes. Includes cost, margin and internal notes."
  - name: webhooks
    description: Inbound provider and Shopify webhooks (signature verified, not called by front-ends).
security:
  - customerSession: []
paths:
  /c/quotes:
    get:
      tags: [customer]
      operationId: listCustomerQuotes
      summary: List my company's quotes
      description: |
        `limit` may be up to 100. The storefront popover lists drafts with `status=DRAFT&limit=100`.
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/QuoteStatus" }
        - name: jobId
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Free-text search over number (Q-##### or digits), title, job, PO.
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Quotes
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CustomerQuoteSummary" }
                  nextCursor: { type: string, nullable: true }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [customer]
      operationId: createCustomerQuote
      summary: Create a draft quote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateQuoteRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerQuote" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/from-cart:
    post:
      tags: [customer]
      operationId: createQuoteFromCart
      summary: Copy the current cart into a new or existing draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FromCartRequest" }
      responses:
        "201":
          description: Draft created or updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerQuote" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    get:
      tags: [customer]
      operationId: getCustomerQuote
      summary: Quote with sent versions, lines (no cost) and customer-visible messages
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerQuote" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [customer]
      operationId: updateCustomerQuote
      summary: Update header fields (lines only editable in DRAFT)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateQuoteRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerQuote" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [customer]
      operationId: deleteCustomerQuote
      summary: Soft delete a DRAFT (transition DELETE, status ARCHIVED)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/lines:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    post:
      tags: [customer]
      operationId: addCustomerQuoteLine
      summary: Add a line (DRAFT only). Price is snapshotted from the buyer's catalog.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddLineRequest" }
      responses:
        "201":
          description: Line added; returns the updated quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerQuote" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/lines/{lineId}:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
      - $ref: "#/components/parameters/LineId"
    patch:
      tags: [customer]
      operationId: updateCustomerQuoteLine
      summary: Change quantity or note (DRAFT only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLineRequest" }
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerQuote" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [customer]
      operationId: deleteCustomerQuoteLine
      summary: Remove a line (DRAFT only)
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerQuote" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/submit:
    post:
      tags: [customer]
      operationId: submitCustomerQuote
      summary: DRAFT to SUBMITTED
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/CustomerQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/withdraw:
    post:
      tags: [customer]
      operationId: withdrawCustomerQuote
      summary: SUBMITTED back to DRAFT
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      responses:
        "200": { $ref: "#/components/responses/CustomerQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/accept:
    post:
      tags: [customer]
      operationId: acceptCustomerQuote
      summary: QUOTE_READY to ACCEPTED (current version)
      description: |
        409 `VERSION_MISMATCH` (with `details.currentVersion`) means staff sent a newer version than the one the
        customer saw: the client must reload the quote and let the customer re-review the new version before
        accepting again. It is never retried automatically.
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                versionNo:
                  type: integer
                  description: Version the customer saw; rejected with VERSION_MISMATCH if a newer one was sent.
      responses:
        "200": { $ref: "#/components/responses/CustomerQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/request-changes:
    post:
      tags: [customer]
      operationId: requestChangesCustomerQuote
      summary: QUOTE_READY to CHANGES_REQUESTED
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "200": { $ref: "#/components/responses/CustomerQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/decline:
    post:
      tags: [customer]
      operationId: declineCustomerQuote
      summary: Close the quote as DECLINED
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/CustomerQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/reopen:
    post:
      tags: [customer]
      operationId: reopenCustomerQuote
      summary: ACCEPTED to IN_REVIEW (customer wants a change before buying)
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      responses:
        "200": { $ref: "#/components/responses/CustomerQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/duplicate:
    post:
      tags: [customer]
      operationId: duplicateCustomerQuote
      summary: Copy any quote into a new DRAFT (prices re-snapshotted)
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      responses:
        "201":
          description: New draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerQuote" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/checkout:
    post:
      tags: [customer]
      operationId: checkoutCustomerQuote
      summary: Accept to buy. Requires ACCEPTED and not expired (isPurchasable); creates or reuses the draft order.
      description: |
        Idempotent. Returns 409 `NOT_PURCHASABLE` if the quote is not ACCEPTED or has expired. The client shows the
        error `message` and offers "Ask for a new quote", which calls `POST /c/quotes/{id}/duplicate` (new DRAFT with
        prices re-snapshotted) and opens the copy.
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      responses:
        "200":
          description: Redirect target
          content:
            application/json:
              schema:
                type: object
                required: [invoiceUrl, draftOrderId]
                properties:
                  invoiceUrl: { type: string, format: uri }
                  draftOrderId: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/pdf:
    get:
      tags: [customer]
      operationId: getCustomerQuotePdf
      summary: Printable PDF of the latest sent version (customer-safe, no cost or margin)
      description: |
        Returns 404 `NOT_FOUND` until at least one version has been sent (DRAFT quotes have no PDF). Add `?version=N` for an earlier sent version. Served with
        `Content-Disposition: inline; filename="Q-#####-vN.pdf"`.
      parameters:
        - $ref: "#/components/parameters/QuoteId"
        - name: version
          in: query
          description: Sent version number; defaults to the current version.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    get:
      tags: [customer]
      operationId: listCustomerMessages
      summary: Conversation (internal notes are never returned)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CustomerMessage" }
                  nextCursor: { type: string, nullable: true }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [customer]
      operationId: postCustomerMessage
      summary: Post a message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostMessageRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerMessage" }
        default: { $ref: "#/components/responses/Error" }
  /c/quotes/{id}/attachments/upload-url:
    post:
      tags: [customer]
      operationId: createCustomerAttachmentUpload
      summary: Signed upload URL for a message attachment
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrl" }
        default: { $ref: "#/components/responses/Error" }
  /c/notification-prefs:
    get:
      tags: [customer]
      operationId: getNotificationPrefs
      summary: My notification preferences
      responses:
        "200":
          description: Prefs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPrefs" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [customer]
      operationId: putNotificationPrefs
      summary: Replace my notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPrefs" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPrefs" }
        default: { $ref: "#/components/responses/Error" }
  /c/active-quote:
    get:
      tags: [customer]
      operationId: getActiveQuote
      summary: Draft that "Add to Quote" targets (header chip)
      responses:
        "200":
          description: Active quote, or null quoteId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveQuote" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [customer]
      operationId: setActiveQuote
      summary: Choose the target draft
      description: |
        The storefront calls this after saving a draft from the cart (`POST /c/quotes/from-cart` with
        `submit: false`) so the header chip follows the new draft. Allowed only for the caller's own DRAFT quotes
        (or `quoteId: null` to clear).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId: { type: string, nullable: true }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveQuote" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ staff
  /s/quotes:
    get:
      tags: [staff]
      operationId: listStaffQuotes
      summary: Sales inbox
      security: [{ staffSession: [] }]
      parameters:
        - name: tab
          in: query
          schema:
            type: string
            enum: [needs_response, unassigned, waiting_customer, accepted, expiring, all]
        - name: rep
          in: query
          description: |
            A staff id, `me` (the signed-in rep) or `unassigned` (no rep and no team).
          schema: { type: string, example: me }
        - name: team
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: |
            Free text over customer, company, job, PO and title. Also matches the display number, with or without
            the prefix and case-insensitively: `Q-10482`, `q10482` and `10482` all find quote 10482.
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Inbox rows
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StaffQuoteSummary" }
                  nextCursor: { type: string, nullable: true }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [staff]
      operationId: createStaffQuote
      summary: Create a quote on behalf of a customer
      security: [{ staffSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffCreateQuoteRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffQuote" }
        default: { $ref: "#/components/responses/Error" }
  /s/quotes/{id}:
    get:
      tags: [staff]
      operationId: getStaffQuote
      summary: Full quote incl. cost, margin, internal notes and all versions
      security: [{ staffSession: [] }]
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffQuote" }
        default: { $ref: "#/components/responses/Error" }
  /s/quotes/{id}/claim:
    post:
      tags: [staff]
      operationId: claimStaffQuote
      summary: Assign to me; SUBMITTED or CHANGES_REQUESTED to IN_REVIEW
      security: [{ staffSession: [] }]
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      responses:
        "200": { $ref: "#/components/responses/StaffQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /s/quotes/{id}/assign:
    post:
      tags: [staff]
      operationId: assignStaffQuote
      summary: Assign to a rep or team (no status change)
      security: [{ staffSession: [] }]
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                repId: { type: string, nullable: true }
                teamId: { type: string, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/StaffQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /s/quotes/{id}/draft-revision:
    put:
      tags: [staff]
      operationId: saveDraftRevision
      summary: Save working lines, freight, expiry and notes (not visible to the customer)
      security: [{ staffSession: [] }]
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftRevisionRequest" }
      responses:
        "200": { $ref: "#/components/responses/StaffQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /s/quotes/{id}/send:
    post:
      tags: [staff]
      operationId: sendStaffRevision
      summary: Freeze working lines into version N+1 and move to QUOTE_READY
      description: |
        Returns 422 FLOOR_APPROVAL_REQUIRED (with `details.lineIds`) if any line is under the rep's
        price floor, or has unknown cost (`costUnknown`), and no manager approval exists for it. A line with unknown
        cost can never be margin-checked, so it ALWAYS needs manager approval before send.

        The new version number is `max(currentVersion, highest versions[].versionNo) + 1`
        (also exposed as `StaffQuote.nextVersionNo`, which the "Send vN" button must use). The same call sets
        `expiresAt` from the working expiry, else `QUOTE_DEFAULT_EXPIRY_DAYS` (14) from now.
      security: [{ staffSession: [] }]
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      responses:
        "200": { $ref: "#/components/responses/StaffQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /s/quotes/{id}/approve-floor:
    post:
      tags: [staff]
      operationId: approveFloor
      summary: Manager approval for lines under the price floor or with unknown cost
      description: Requires role manager or admin (403 `FORBIDDEN` otherwise). Approving a `costUnknown` line is how it becomes sendable.
      security: [{ staffSession: [] }]
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lineIds:
                  type: array
                  items: { type: string }
                  description: Omit to approve every flagged line.
                note: { type: string }
      responses:
        "200": { $ref: "#/components/responses/StaffQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /s/quotes/{id}/reopen:
    post:
      tags: [staff]
      operationId: reopenStaffQuote
      summary: ACCEPTED to IN_REVIEW; the linked draft order is discarded on the next checkout
      security: [{ staffSession: [] }]
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      responses:
        "200": { $ref: "#/components/responses/StaffQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /s/quotes/{id}/decline:
    post:
      tags: [staff]
      operationId: declineStaffQuote
      summary: Close the quote as DECLINED
      security: [{ staffSession: [] }]
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/StaffQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /s/quotes/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    get:
      tags: [staff]
      operationId: listStaffMessages
      summary: Conversation including internal notes
      security: [{ staffSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StaffMessage" }
                  nextCursor: { type: string, nullable: true }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [staff]
      operationId: postStaffMessage
      summary: Post to the customer, or an internal note (internal true never notifies the customer)
      security: [{ staffSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PostMessageRequest"
                - type: object
                  properties:
                    internal: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMessage" }
        default: { $ref: "#/components/responses/Error" }
  /s/quotes/{id}/request-floor-approval:
    post:
      tags: [staff]
      operationId: requestFloorApproval
      summary: Ask a manager to approve lines under the price floor (or with unknown cost)
      description: |
        No status change. Writes a `FLOOR_APPROVAL_REQUESTED` row to `events` (payload: lineIds, note, requester) and
        notifies every manager (and the assigned team's manager if any). A manager then calls `approve-floor`.
        Safe to call again; each call notifies again.
      security: [{ staffSession: [] }]
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lineIds:
                  type: array
                  items: { type: string }
                  description: Omit to request approval for every flagged line.
                note: { type: string, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/StaffQuoteOk" }
        default: { $ref: "#/components/responses/Error" }
  /s/quotes/{id}/attachments/upload-url:
    post:
      tags: [staff]
      operationId: createStaffAttachmentUpload
      summary: Signed upload URL for a staff message attachment
      security: [{ staffSession: [] }]
      parameters: [{ $ref: "#/components/parameters/QuoteId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrl" }
        default: { $ref: "#/components/responses/Error" }
  /s/reports/summary:
    get:
      tags: [staff]
      operationId: getStaffSummary
      summary: Inbox tiles
      security: [{ staffSession: [] }]
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSummary" }
        default: { $ref: "#/components/responses/Error" }
  /s/me:
    get:
      tags: [staff]
      operationId: getStaffMe
      summary: The signed-in staff member (role, teams, effective price floor)
      security: [{ staffSession: [] }]
      responses:
        "200":
          description: Current staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMe" }
        default: { $ref: "#/components/responses/Error" }
  /s/staff:
    get:
      tags: [staff]
      operationId: listStaff
      summary: Staff members (reps, managers) for assignment pickers and settings
      security: [{ staffSession: [] }]
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Staff
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StaffMember" }
        default: { $ref: "#/components/responses/Error" }
  /s/staff/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [staff]
      operationId: updateStaffMember
      summary: Change a staff member's role, teams, personal price floor or active flag (manager or admin only)
      security: [{ staffSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStaffRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        default: { $ref: "#/components/responses/Error" }
  /s/teams:
    get:
      tags: [staff]
      operationId: listTeams
      summary: Teams
      security: [{ staffSession: [] }]
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Team" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [staff]
      operationId: createTeam
      summary: Create a team (manager or admin only)
      security: [{ staffSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        default: { $ref: "#/components/responses/Error" }
  /s/teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [staff]
      operationId: updateTeam
      summary: Rename a team or replace its members (manager or admin only)
      security: [{ staffSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [staff]
      operationId: deleteTeam
      summary: Delete a team (manager or admin only)
      description: |
        Quotes assigned to the team keep their rep but lose `teamId`; routing rules that point at the team are
        removed. A team that is the `defaultTeamId` in settings returns 400 `BAD_REQUEST` until the default is changed.
      security: [{ staffSession: [] }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /s/settings:
    get:
      tags: [staff]
      operationId: getStaffSettings
      summary: Default price floor and routing rules
      security: [{ staffSession: [] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [staff]
      operationId: putStaffSettings
      summary: Replace settings (manager or admin only)
      security: [{ staffSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffSettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSettings" }
        default: { $ref: "#/components/responses/Error" }
  /s/saved-replies:
    get:
      tags: [staff]
      operationId: listSavedReplies
      summary: Saved replies available to the signed-in staff member (shared plus personal)
      security: [{ staffSession: [] }]
      responses:
        "200":
          description: Saved replies
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SavedReply" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [staff]
      operationId: putSavedReplies
      summary: Replace the full list of saved replies
      description: |
        Replaces the caller's personal replies and, for managers and admins only, the shared ones
        (`shared: true` items from a rep are rejected with 403 `FORBIDDEN`). Items without `id` are created.
      security: [{ staffSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items: { $ref: "#/components/schemas/SavedReplyInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SavedReply" }
        default: { $ref: "#/components/responses/Error" }
  /s/customers:
    get:
      tags: [staff]
      operationId: searchStaffCustomers
      summary: Find a customer (and company location) to create a quote on their behalf
      description: Matches name, email, phone and company name. Minimum 2 characters in `q`.
      security: [{ staffSession: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StaffCustomer" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------- webhooks
  /webhooks/shopify:
    post:
      tags: [webhooks]
      operationId: hookShopify
      summary: Shopify webhook receiver (HMAC verified). One URL for every subscribed topic.
      description: |
        Verify `X-Shopify-Hmac-Sha256` (base64 HMAC-SHA256 of the raw body with `SHOPIFY_API_SECRET`) before parsing;
        invalid signature returns 401 `UNAUTHENTICATED`. Dispatch on `X-Shopify-Topic`:

        - `orders/create`: if the order carries a `quote:Q-#####` tag, `transition(ORDER_PLACED)`; otherwise ignore.
        - `draft_orders/update`: sync draft order state (invoice sent, completed) for the linked quote.
        - `app/uninstalled`: mark the shop uninstalled and stop processing for it.
        - `customers/data_request`, `customers/redact`, `shop/redact`: compliance topics, must return 200.

        Idempotent on `X-Shopify-Webhook-Id` (a repeated id returns 200 and does nothing). Respond 200 within 5 seconds;
        do slow work asynchronously. Unknown topics return 200.
      security: [{ shopifyHmac: [] }]
      parameters:
        - { name: X-Shopify-Topic, in: header, required: true, schema: { type: string, example: orders/create } }
        - { name: X-Shopify-Shop-Domain, in: header, required: true, schema: { type: string } }
        - { name: X-Shopify-Webhook-Id, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Topic specific Shopify payload; not modeled here.
              additionalProperties: true
      responses:
        "200": { description: Accepted }
        "401":
          description: Invalid HMAC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /hooks/email-inbound:
    post:
      tags: [webhooks]
      operationId: hookEmailInbound
      summary: Inbound email reply (provider signature verified). Becomes a Message with channel EMAIL.
      description: Served from `apps/api`; implemented and owned by the notifications agent.
      security: [{ providerSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider payload (Postmark inbound JSON); only the fields below are relied on.
              properties:
                To: { type: string }
                From: { type: string }
                TextBody: { type: string }
                StrippedTextReply: { type: string }
              additionalProperties: true
      responses:
        "200": { description: Accepted }
        default: { $ref: "#/components/responses/Error" }
  /hooks/twilio-inbound:
    post:
      tags: [webhooks]
      operationId: hookTwilioInbound
      summary: Inbound SMS (X-Twilio-Signature verified). Handles STOP/HELP, else Message with channel SMS.
      description: Served from `apps/api`; implemented and owned by the notifications agent.
      security: [{ providerSignature: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                From: { type: string }
                To: { type: string }
                Body: { type: string }
                MessageSid: { type: string }
              additionalProperties: true
      responses:
        "200": { description: Accepted (TwiML body optional) }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Customer account session token (`Authorization: Bearer <token>`; the only option on the absolute HTTPS origin),
        or app proxy HMAC query signature from the storefront (`/apps/quotes/c/...`).
    staffSession:
      type: http
      scheme: bearer
      description: Shopify admin session token (JWT).
    shopifyHmac:
      type: apiKey
      in: header
      name: X-Shopify-Hmac-Sha256
      description: Base64 HMAC-SHA256 of the raw request body using the app client secret (`SHOPIFY_API_SECRET`).
    providerSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: Provider specific signature header (Postmark basic auth / X-Twilio-Signature).
  parameters:
    QuoteId:
      name: id
      in: path
      required: true
      schema: { type: string }
    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 100 (default 25).
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: NOT_FOUND, message: Quote not found }
    CustomerQuoteOk:
      description: Updated quote
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CustomerQuote" }
    StaffQuoteOk:
      description: Updated quote
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StaffQuote" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine code. Used values: BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND,
            INVALID_TRANSITION, NOT_PURCHASABLE, VERSION_MISMATCH, NOT_EDITABLE, FLOOR_APPROVAL_REQUIRED,
            VALIDATION_FAILED, RATE_LIMITED, INTERNAL.

            Client handling: `NOT_PURCHASABLE` (409, checkout) means the quote is not ACCEPTED or has expired; show the
            message and offer "Ask for a new quote" (duplicate). `VERSION_MISMATCH` (409, accept) means a newer version
            was sent; reload and re-review the new version. `RATE_LIMITED` is reserved: rate limiting is deferred and
            the API does not emit it yet.
          example: INVALID_TRANSITION
        message: { type: string, example: "SUBMIT is not allowed from ORDERED" }
        details:
          type: object
          additionalProperties: true
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: "1234.50"
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      example: USD
      description: |
        ISO 4217 currency of every Money value on the same quote (summary, versions, lines, staff fields).
        Money itself stays a plain decimal string; there is never a mix of currencies within one quote.
    QuoteStatus:
      type: string
      enum: [DRAFT, SUBMITTED, IN_REVIEW, QUOTE_READY, CHANGES_REQUESTED, ACCEPTED, ORDERED, EXPIRED, DECLINED, ARCHIVED]
    WaitingOn:
      type: string
      enum: [customer, sales, none]
    Address:
      type: object
      properties:
        name: { type: string }
        company: { type: string }
        address1: { type: string }
        address2: { type: string, nullable: true }
        city: { type: string }
        province: { type: string }
        zip: { type: string }
        country: { type: string, example: US }
        phone: { type: string, nullable: true }
    JobRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        poNumber: { type: string, nullable: true }
        siteAddress: { type: string, nullable: true }
    NewJob:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        poNumber: { type: string }
        siteAddress: { type: string }
    Attachment:
      type: object
      required: [url, name, size, mime]
      properties:
        url: { type: string, format: uri }
        name: { type: string }
        size: { type: integer }
        mime: { type: string }
    Pagination:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }

    # ---- customer-safe shapes: NO cost, margin, internalNote, internal messages
    CustomerQuoteLine:
      type: object
      required: [id, variantId, title, qty, listPrice, quotedPrice, lineTotal, position]
      properties:
        id: { type: string }
        variantId: { type: string, description: "gid://shopify/ProductVariant/..." }
        sku: { type: string, nullable: true }
        title: { type: string }
        imageUrl: { type: string, format: uri, nullable: true }
        qty: { type: integer, minimum: 1 }
        listPrice: { $ref: "#/components/schemas/Money" }
        quotedPrice: { $ref: "#/components/schemas/Money" }
        lineTotal: { $ref: "#/components/schemas/Money" }
        lineNote:
          type: string
          nullable: true
          description: Customer-visible note on this line (written by the customer or the rep).
        position: { type: integer }
    CustomerQuoteVersion:
      type: object
      required: [versionNo, sentAt, subtotal, discountTotal, freight, total, lines]
      properties:
        versionNo: { type: integer, minimum: 1 }
        sentAt: { type: string, format: date-time }
        subtotal: { $ref: "#/components/schemas/Money" }
        discountTotal: { $ref: "#/components/schemas/Money" }
        freight: { $ref: "#/components/schemas/Money" }
        taxEstimate: { type: string, nullable: true, pattern: '^-?\d+\.\d{2}$', example: "1234.50" }
        total: { $ref: "#/components/schemas/Money" }
        repNote:
          type: string
          nullable: true
          description: Customer-visible job notes from the rep.
        lines:
          type: array
          items: { $ref: "#/components/schemas/CustomerQuoteLine" }
    CustomerMessage:
      type: object
      required: [id, authorType, body, attachments, channel, createdAt]
      properties:
        id: { type: string }
        authorType: { type: string, enum: [CUSTOMER, STAFF, SYSTEM] }
        authorName: { type: string, nullable: true }
        body: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        channel: { type: string, enum: [WEB, EMAIL, SMS] }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    CustomerQuoteActions:
      type: object
      description: Server-computed so front-ends never re-implement the state machine.
      required: [canEditLines, canEditHeader, canSubmit, canWithdraw, canAccept, canRequestChanges, canBuy, canReopen, canDelete, canDecline]
      properties:
        canEditLines: { type: boolean }
        canEditHeader:
          type: boolean
          description: Job, PO, needed-by, ship-to, notes and watchers may be changed via PATCH /c/quotes/{id} (DRAFT).
        canSubmit: { type: boolean }
        canWithdraw: { type: boolean }
        canAccept: { type: boolean }
        canRequestChanges: { type: boolean }
        canBuy: { type: boolean, description: "isPurchasable(status, expiresAt)" }
        canReopen: { type: boolean }
        canDelete: { type: boolean }
        canDecline: { type: boolean }
    CustomerQuoteSummary:
      type: object
      required: [id, number, title, status, waitingOn, lineCount, currencyCode, total, unreadCount, updatedAt, actions]
      properties:
        id: { type: string }
        number: { type: integer, example: 10482 }
        displayNumber: { type: string, example: Q-10482 }
        title: { type: string }
        status: { $ref: "#/components/schemas/QuoteStatus" }
        waitingOn: { $ref: "#/components/schemas/WaitingOn" }
        job: { type: object, nullable: true, allOf: [{ $ref: "#/components/schemas/JobRef" }] }
        currentVersion: { type: integer }
        lineCount: { type: integer }
        currencyCode: { $ref: "#/components/schemas/CurrencyCode" }
        total: { $ref: "#/components/schemas/Money" }
        previousTotal:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: "1234.50"
          nullable: true
          description: Total of the sent version before the current one; null when only one version has been sent.
        expiresAt: { type: string, format: date-time, nullable: true }
        ownerName: { type: string }
        assignedRepName: { type: string, nullable: true }
        unreadCount:
          type: integer
          minimum: 0
          description: Customer-visible messages (never internal notes) not yet read by this customer.
        orderId: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
        actions: { $ref: "#/components/schemas/CustomerQuoteActions" }
    CustomerQuote:
      allOf:
        - $ref: "#/components/schemas/CustomerQuoteSummary"
        - type: object
          required: [lines, versions, messages]
          properties:
            poNumber: { type: string, nullable: true }
            neededBy: { type: string, format: date, nullable: true }
            shipTo: { type: object, nullable: true, allOf: [{ $ref: "#/components/schemas/Address" }] }
            notesToSales: { type: string, nullable: true }
            watchers:
              type: array
              items: { type: string, format: email }
            lines:
              type: array
              description: Customer's working draft lines when DRAFT, otherwise the latest sent version's lines.
              items: { $ref: "#/components/schemas/CustomerQuoteLine" }
            versions:
              type: array
              description: Sent revisions only, ascending.
              items: { $ref: "#/components/schemas/CustomerQuoteVersion" }
            messages:
              type: array
              description: Latest page of customer-visible messages (use the messages endpoint for more).
              items: { $ref: "#/components/schemas/CustomerMessage" }
    CreateQuoteRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        jobId: { type: string }
        newJob: { $ref: "#/components/schemas/NewJob" }
        poNumber: { type: string }
        neededBy: { type: string, format: date }
        setActive: { type: boolean, default: true }
    UpdateQuoteRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        jobId: { type: string, nullable: true }
        newJob: { $ref: "#/components/schemas/NewJob" }
        poNumber: { type: string, nullable: true }
        neededBy: { type: string, format: date, nullable: true }
        shipTo: { type: object, nullable: true, allOf: [{ $ref: "#/components/schemas/Address" }] }
        notesToSales: { type: string, nullable: true, maxLength: 5000 }
        watchers:
          type: array
          items: { type: string, format: email }
    AddLineRequest:
      type: object
      required: [variantId, qty]
      properties:
        variantId: { type: string }
        qty: { type: integer, minimum: 1, maximum: 100000 }
        lineNote: { type: string }
    UpdateLineRequest:
      type: object
      minProperties: 1
      properties:
        qty: { type: integer, minimum: 1, maximum: 100000 }
        lineNote: { type: string, nullable: true }
    CartLine:
      type: object
      required: [variantId, qty]
      properties:
        variantId: { type: string }
        qty: { type: integer, minimum: 1 }
    FromCartRequest:
      type: object
      required: [cartLines, target]
      properties:
        cartLines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CartLine" }
        target:
          oneOf:
            - type: object
              required: [mode, title]
              properties:
                mode: { type: string, enum: [new] }
                title: { type: string }
                jobId: { type: string }
                newJob: { $ref: "#/components/schemas/NewJob" }
                poNumber: { type: string }
                neededBy: { type: string, format: date }
                notesToSales: { type: string }
            - type: object
              required: [mode, quoteId]
              description: |
                Append the cart lines to an existing DRAFT. The optional header fields overwrite the draft's
                values only when present (omit to leave unchanged).
              properties:
                mode: { type: string, enum: [existing] }
                quoteId: { type: string }
                poNumber: { type: string }
                neededBy: { type: string, format: date }
                notesToSales: { type: string }
        submit:
          type: boolean
          default: false
          description: true = "Submit to sales", false = "Save as draft".
        emptyCart:
          type: boolean
          default: false
          description: |
            Informational only. The API ignores it and never touches the Shopify cart; the storefront block
            clears the cart itself after a 2xx response.
    SubmitRequest:
      type: object
      properties:
        notesToSales: { type: string }
        neededBy: { type: string, format: date }
        poNumber: { type: string }
    PostMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
    UploadUrlRequest:
      type: object
      required: [name, size, mime]
      properties:
        name: { type: string }
        size: { type: integer, maximum: 26214400 }
        mime: { type: string }
    UploadUrl:
      type: object
      required: [uploadUrl, fileUrl, expiresAt]
      properties:
        uploadUrl: { type: string, format: uri }
        fileUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    ActiveQuote:
      type: object
      required: [quoteId]
      properties:
        quoteId: { type: string, nullable: true }
        number: { type: integer, nullable: true }
        title: { type: string, nullable: true }
        lineCount: { type: integer, nullable: true }
    NotificationChannelPref:
      type: object
      required: [email, sms]
      properties:
        email: { type: boolean }
        sms: { type: boolean }
    NotificationEvent:
      type: string
      enum: [QUOTE_RECEIVED, QUOTE_READY, NEW_MESSAGE, EXPIRING, ORDERED, ACCEPTED, WEEKLY_SUMMARY]
      description: |
        Customer-facing notification keys (the full set). QUOTE_RECEIVED = we got your request (SUBMITTED),
        QUOTE_READY = a version was sent, NEW_MESSAGE = staff message, EXPIRING = 3-day reminder,
        ORDERED = order placed, ACCEPTED = acceptance confirmation, WEEKLY_SUMMARY = weekly digest of open quotes.
        CHANGES_REQUESTED is staff-only and is not a customer preference.
    WatcherScope:
      type: string
      description: The literal `all` (every quote) or a job id (`JobRef.id`) to follow only that job's quotes.
      example: all
    Watcher:
      type: object
      required: [email, scope, channels]
      properties:
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        role: { type: string, nullable: true, example: Project manager }
        scope: { $ref: "#/components/schemas/WatcherScope" }
        channels: { $ref: "#/components/schemas/NotificationChannelPref" }
    NotificationPrefs:
      type: object
      required: [events, email]
      properties:
        events:
          type: object
          description: One entry per NotificationEvent. PUT replaces all of them.
          required: [QUOTE_RECEIVED, QUOTE_READY, NEW_MESSAGE, EXPIRING, ORDERED, ACCEPTED, WEEKLY_SUMMARY]
          additionalProperties: false
          properties:
            QUOTE_RECEIVED: { $ref: "#/components/schemas/NotificationChannelPref" }
            QUOTE_READY: { $ref: "#/components/schemas/NotificationChannelPref" }
            NEW_MESSAGE: { $ref: "#/components/schemas/NotificationChannelPref" }
            EXPIRING: { $ref: "#/components/schemas/NotificationChannelPref" }
            ORDERED: { $ref: "#/components/schemas/NotificationChannelPref" }
            ACCEPTED: { $ref: "#/components/schemas/NotificationChannelPref" }
            WEEKLY_SUMMARY: { $ref: "#/components/schemas/NotificationChannelPref" }
        email: { type: string, format: email }
        phone: { type: string, nullable: true, example: "+13125550123" }
        smsOptIn:
          type: boolean
          description: Must be true (with the exact consent text recorded server-side) before any SMS is sent.
        smsConsentText:
          type: string
          description: Exact consent copy shown to the customer; stored with smsOptInAt.
        smsOptInAt: { type: string, format: date-time, nullable: true, readOnly: true }
        quietStart: { type: string, nullable: true, example: "19:00" }
        quietEnd: { type: string, nullable: true, example: "07:00" }
        timezone: { type: string, example: America/New_York }
        watchers:
          type: array
          description: People who also receive the selected channels, for all quotes or one job.
          items: { $ref: "#/components/schemas/Watcher" }

    # ---- staff shapes (cost, margin, internal notes allowed)
    StaffQuoteLine:
      type: object
      required: [id, variantId, title, qty, listPrice, quotedPrice, lineTotal, position]
      properties:
        id: { type: string }
        variantId: { type: string }
        sku: { type: string, nullable: true }
        title: { type: string }
        imageUrl: { type: string, format: uri, nullable: true }
        qty: { type: integer, minimum: 1 }
        listPrice: { $ref: "#/components/schemas/Money" }
        quotedPrice: { $ref: "#/components/schemas/Money" }
        cost: { type: string, nullable: true, pattern: '^-?\d+\.\d{2}$', example: "1234.50" }
        lineTotal: { $ref: "#/components/schemas/Money" }
        marginPct: { type: number, nullable: true, description: "(quotedPrice - cost) / quotedPrice * 100" }
        belowFloor: { type: boolean, description: "Under the effective price floor, or cost unknown." }
        costUnknown:
          type: boolean
          description: Cost could not be read from inventory. Margin is null and the line needs manager approval before send.
        floorApproved: { type: boolean }
        lineNote: { type: string, nullable: true, description: "Customer-visible note on the line (also shown as `CustomerQuoteLine.lineNote`). There is no per-line internal note; use the quote's internalNote." }
        addedBy: { type: string, enum: [CUSTOMER, STAFF, SYSTEM] }
        position: { type: integer }
    StaffQuoteVersion:
      type: object
      required: [versionNo, sentAt, subtotal, freight, total, lines]
      properties:
        versionNo: { type: integer }
        sentAt: { type: string, format: date-time }
        sentById: { type: string, nullable: true }
        subtotal: { $ref: "#/components/schemas/Money" }
        discountTotal: { $ref: "#/components/schemas/Money" }
        freight: { $ref: "#/components/schemas/Money" }
        taxEstimate: { type: string, nullable: true, pattern: '^-?\d+\.\d{2}$', example: "1234.50" }
        total: { $ref: "#/components/schemas/Money" }
        marginTotal: { type: string, nullable: true, pattern: '^-?\d+\.\d{2}$', example: "1234.50" }
        marginPct: { type: number, nullable: true }
        repNote: { type: string, nullable: true }
        internalNote: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: "#/components/schemas/StaffQuoteLine" }
    StaffMessage:
      type: object
      required: [id, authorType, body, internal, attachments, channel, createdAt]
      properties:
        id: { type: string }
        authorType: { type: string, enum: [CUSTOMER, STAFF, SYSTEM] }
        authorId: { type: string, nullable: true }
        authorName: { type: string, nullable: true }
        body: { type: string }
        internal: { type: boolean }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        channel: { type: string, enum: [WEB, EMAIL, SMS] }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    StaffRole:
      type: string
      enum: [rep, manager, admin]
      description: rep = sells and replies; manager = also approves floor exceptions and edits teams/settings; admin = manager plus app install settings.
    StaffMe:
      type: object
      required: [id, name, email, role, teamIds, effectivePriceFloorPct]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/StaffRole" }
        teamIds:
          type: array
          items: { type: string }
        priceFloorPct:
          type: number
          nullable: true
          description: Personal override; null means use the default from settings.
        effectivePriceFloorPct:
          type: number
          description: Minimum margin percent below which a line needs manager approval (personal override, else the default).
        canApproveFloor: { type: boolean }
        canEditSettings: { type: boolean }
    StaffMember:
      type: object
      required: [id, name, email, role, teamIds, active]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/StaffRole" }
        teamIds:
          type: array
          items: { type: string }
        priceFloorPct: { type: number, nullable: true }
        active: { type: boolean }
    UpdateStaffRequest:
      type: object
      minProperties: 1
      properties:
        role: { $ref: "#/components/schemas/StaffRole" }
        teamIds:
          type: array
          items: { type: string }
        priceFloorPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        active: { type: boolean }
    Team:
      type: object
      required: [id, name, memberIds]
      properties:
        id: { type: string }
        name: { type: string }
        memberIds:
          type: array
          items: { type: string }
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        memberIds:
          type: array
          items: { type: string }
    RoutingRule:
      type: object
      required: [companyId]
      description: Auto-assign new SUBMITTED quotes from this company. Provide repId, teamId or both (rep wins for ownership, team for visibility).
      properties:
        id: { type: string }
        companyId: { type: string, description: "gid://shopify/Company/..." }
        companyName: { type: string, nullable: true, readOnly: true }
        repId: { type: string, nullable: true }
        teamId: { type: string, nullable: true }
    StaffSettings:
      type: object
      required: [defaultPriceFloorPct, routing]
      properties:
        defaultPriceFloorPct:
          type: number
          minimum: 0
          maximum: 100
          description: Default minimum margin percent for lines when a rep has no personal floor.
        routing:
          type: object
          required: [autoAssignByCompany, rules]
          properties:
            defaultTeamId:
              type: string
              nullable: true
              description: Team that receives quotes no rule matches.
            autoAssignByCompany:
              type: boolean
              description: When true, `rules` are applied on SUBMIT; when false they are stored but ignored.
            rules:
              type: array
              items: { $ref: "#/components/schemas/RoutingRule" }
    SavedReply:
      type: object
      required: [id, title, body, shared]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        shared: { type: boolean, description: "true = visible to all staff (managed by managers)." }
    SavedReplyInput:
      type: object
      required: [title, body]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        shared: { type: boolean, default: false }
    StaffCustomerLocation:
      type: object
      required: [companyLocationId, name]
      properties:
        companyLocationId: { type: string }
        name: { type: string }
        shipTo: { type: object, nullable: true, allOf: [{ $ref: "#/components/schemas/Address" }] }
    StaffCustomer:
      type: object
      required: [customerId, name, email]
      properties:
        customerId: { type: string, description: "gid://shopify/Customer/..." }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        companyId: { type: string, nullable: true }
        companyName: { type: string, nullable: true }
        locations:
          type: array
          items: { $ref: "#/components/schemas/StaffCustomerLocation" }
    StaffQuoteSummary:
      type: object
      required: [id, number, title, status, waitingOn, customerName, currencyCode, itemCount, total, updatedAt]
      properties:
        id: { type: string }
        number: { type: integer }
        displayNumber: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/QuoteStatus" }
        waitingOn: { $ref: "#/components/schemas/WaitingOn" }
        waitingSince: { type: string, format: date-time, nullable: true }
        customerName: { type: string }
        companyName: { type: string, nullable: true }
        jobName: { type: string, nullable: true }
        assignedRepId: { type: string, nullable: true }
        assignedRepName: { type: string, nullable: true }
        teamId: { type: string, nullable: true }
        currentVersion: { type: integer }
        itemCount: { type: integer, minimum: 0, description: "Number of line items (lines, not units) shown in inbox rows." }
        currencyCode: { $ref: "#/components/schemas/CurrencyCode" }
        total: { $ref: "#/components/schemas/Money" }
        marginPct: { type: number, nullable: true }
        belowFloor: { type: boolean, description: "true if any line is under the floor or has unknown cost and is not yet approved." }
        expiresAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    StaffQuoteEvent:
      type: object
      required: [id, type, actorType, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        actorType: { type: string, enum: [CUSTOMER, STAFF, SYSTEM] }
        actorId: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    StaffQuote:
      allOf:
        - $ref: "#/components/schemas/StaffQuoteSummary"
        - type: object
          required: [workingLines, versions, messages]
          properties:
            customerId: { type: string }
            customerContactName: { type: string, nullable: true }
            customerContactPhone: { type: string, nullable: true }
            paymentTerms: { type: string, nullable: true, example: Net 30, description: "Company payment terms from Shopify, read only." }
            nextVersionNo:
              type: integer
              readOnly: true
              description: max(currentVersion, highest versions[].versionNo) + 1; the N in "Send vN".
            companyId: { type: string, nullable: true }
            companyLocationId: { type: string, nullable: true }
            job: { type: object, nullable: true, allOf: [{ $ref: "#/components/schemas/JobRef" }] }
            poNumber: { type: string, nullable: true }
            neededBy: { type: string, format: date, nullable: true }
            shipTo: { type: object, nullable: true, allOf: [{ $ref: "#/components/schemas/Address" }] }
            notesToSales: { type: string, nullable: true }
            watchers:
              type: array
              items: { type: string, format: email }
            draftOrderId: { type: string, nullable: true }
            orderId: { type: string, nullable: true }
            latestChangeRequest:
              type: string
              nullable: true
              description: Customer's most recent change-request text (editor callout).
            workingLines:
              type: array
              description: Editable working revision (what Save draft stores).
              items: { $ref: "#/components/schemas/StaffQuoteLine" }
            workingFreight: { $ref: "#/components/schemas/Money" }
            workingExpiresAt:
              type: string
              format: date-time
              nullable: true
              description: Expiry saved with the working revision; becomes `expiresAt` when the revision is sent.
            workingRepNote: { type: string, nullable: true, description: "Customer-visible job notes (becomes `repNote` on send)." }
            workingInternalNote: { type: string, nullable: true, description: "Staff only; never copied to a customer shape." }
            versions:
              type: array
              items: { $ref: "#/components/schemas/StaffQuoteVersion" }
            messages:
              type: array
              items: { $ref: "#/components/schemas/StaffMessage" }
            events:
              type: array
              items: { $ref: "#/components/schemas/StaffQuoteEvent" }
    StaffCreateQuoteRequest:
      type: object
      required: [customerId, title]
      description: Use `GET /s/customers?q=` to find `customerId` and `companyLocationId`.
      properties:
        customerId: { type: string }
        companyLocationId: { type: string }
        title: { type: string }
        jobId: { type: string }
        newJob: { $ref: "#/components/schemas/NewJob" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/AddLineRequest" }
        submit:
          type: boolean
          default: false
    StaffLineInput:
      type: object
      required: [variantId, qty, quotedPrice]
      description: |
        There is no variant price/cost lookup endpoint (decision: cost never needs to reach the client before a save).
        When a line without `id` is saved through `PUT /s/quotes/{id}/draft-revision`, the server snapshots the buyer's
        contextual `listPrice` and the inventory unit `cost` for that `variantId` (rule 6) and returns them, with
        `marginPct`, `belowFloor` and `costUnknown`, on the updated `workingLines`. The admin app therefore saves right
        after the resource picker adds a product and renders cost and margin from the response.
      properties:
        id: { type: string, description: "Existing working line id; omit for a new line." }
        variantId: { type: string }
        qty: { type: integer, minimum: 1 }
        quotedPrice: { $ref: "#/components/schemas/Money" }
        lineNote: { type: string, nullable: true, description: Customer-visible; shown on the line in every sent version. }
    DraftRevisionRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/StaffLineInput" }
        freight: { $ref: "#/components/schemas/Money" }
        expiresAt: { type: string, format: date-time, nullable: true }
        repNote: { type: string, nullable: true, description: Customer-visible job notes. }
        internalNote: { type: string, nullable: true, description: Staff only. }
    StaffSummary:
      type: object
      required: [needsResponse, openValue, acceptedThisWeek, expiringSoon, tabCounts]
      properties:
        tabCounts:
          type: object
          description: Badge counts for the inbox tabs, same filters as `GET /s/quotes?tab=`.
          required: [needs_response, unassigned, waiting_customer, accepted, expiring, all]
          additionalProperties: false
          properties:
            needs_response: { type: integer }
            unassigned: { type: integer }
            waiting_customer: { type: integer }
            accepted: { type: integer }
            expiring: { type: integer }
            all: { type: integer }
        needsResponse: { type: integer }
        unassigned: { type: integer }
        openValue: { $ref: "#/components/schemas/Money" }
        acceptedThisWeek: { type: integer }
        acceptedThisWeekValue: { $ref: "#/components/schemas/Money" }
        expiringSoon: { type: integer }
